# No "version:" field – Compose V2 doesn't need it (and V1 is deprecated)

services:
  # ── Nginx Reverse Proxy ──────────────────────────────
  nginx:
    image: nginx:alpine
    ports:
      - "${PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - client
      - server
    restart: unless-stopped
    networks:
      - pixelvault

  # ── React Frontend ───────────────────────────────────
  client:
    build:
      context: .
      dockerfile: docker/Dockerfile.client
    restart: unless-stopped
    networks:
      - pixelvault

  # ── Node.js Backend ──────────────────────────────────
  server:
    build:
      context: .
      dockerfile: docker/Dockerfile.server
    env_file:
      - .env
    environment:
      - DB_URL=${DB_URL:-postgresql://pixelvault:pixelvault@postgres:5432/pixelvault}
      - MINIO_ENDPOINT=${MINIO_ENDPOINT:-minio}
      - MINIO_PORT=${MINIO_PORT:-9000}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-pixelvault}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-pixelvault123}
      - MINIO_BUCKET=${MINIO_BUCKET:-images}
      - MINIO_USE_SSL=${MINIO_USE_SSL:-false}
      - CLAMAV_HOST=clamav
      - CLAMAV_PORT=3310
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      clamav:
        condition: service_started
    restart: unless-stopped
    networks:
      - pixelvault

  # ── PostgreSQL Datenbank ─────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-pixelvault}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-pixelvault}
      POSTGRES_DB: ${DB_NAME:-pixelvault}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pixelvault"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks:
      - pixelvault

  # ── MinIO Objektspeicher ─────────────────────────────
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-pixelvault}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-pixelvault123}
    volumes:
      - minio_data:/data
    healthcheck:
      # HTTP-based check works on all MinIO versions (old and new)
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks:
      - pixelvault

  # ── MinIO Bucket Setup (runs once, then exits) ───────
  minio-setup:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ACCESS_KEY:-pixelvault} ${MINIO_SECRET_KEY:-pixelvault123} &&
      mc mb --ignore-existing local/${MINIO_BUCKET:-images} &&
      mc anonymous set download local/${MINIO_BUCKET:-images}/thumbnails &&
      echo 'MinIO bucket ready'
      "
    networks:
      - pixelvault

  # ── ClamAV Malware Scanner ───────────────────────────
  clamav:
    image: clamav/clamav:stable
    volumes:
      - clamav_data:/var/lib/clamav
    restart: unless-stopped
    networks:
      - pixelvault

volumes:
  postgres_data:
  minio_data:
  clamav_data:

networks:
  pixelvault:
    driver: bridge
