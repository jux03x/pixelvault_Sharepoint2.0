# PixelVault docker-compose.yml
# Kein "version:" Feld - Compose V2 braucht das nicht mehr

services:

  # ── Nginx Reverse Proxy ──────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    ports:
      - "${PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - client
      - server
    restart: unless-stopped
    networks:
      - pixelvault

  # ── React Frontend ───────────────────────────────────────────────────────
  client:
    build:
      context: .
      dockerfile: docker/Dockerfile.client
    restart: unless-stopped
    networks:
      - pixelvault

  # ── Node.js Backend ──────────────────────────────────────────────────────
  server:
    build:
      context: .
      dockerfile: docker/Dockerfile.server
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - DB_URL=postgresql://${DB_USER:-pixelvault}:${DB_PASSWORD:-pixelvault}@postgres:5432/${DB_NAME:-pixelvault}
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
      - MINIO_USE_SSL=false
      - CLAMAV_HOST=clamav
      - CLAMAV_PORT=3310
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - pixelvault

  # ── PostgreSQL ───────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-pixelvault}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-pixelvault}
      POSTGRES_DB: ${DB_NAME:-pixelvault}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-pixelvault}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped
    networks:
      - pixelvault

  # ── MinIO Objektspeicher ─────────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-pixelvault}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-pixelvault123}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped
    networks:
      - pixelvault

  # ── MinIO Bucket Setup (läuft einmal, beendet sich dann) ────────────────
  minio-setup:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 $${MINIO_ACCESS_KEY:-pixelvault} $${MINIO_SECRET_KEY:-pixelvault123} &&
        mc mb --ignore-existing local/$${MINIO_BUCKET:-images} &&
        echo 'Bucket bereit'
      "
    networks:
      - pixelvault

  # ── ClamAV Malware Scanner ───────────────────────────────────────────────
  clamav:
    image: clamav/clamav:stable
    volumes:
      - clamav_data:/var/lib/clamav
    restart: unless-stopped
    networks:
      - pixelvault

volumes:
  postgres_data:
  minio_data:
  clamav_data:

networks:
  pixelvault:
    driver: bridge
