services:

  nginx:
    image: nginx:alpine
    ports:
      - "${PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - client
      - server
    restart: unless-stopped
    networks:
      - pixelvault

  client:
    build:
      context: .
      dockerfile: docker/Dockerfile.client
    restart: unless-stopped
    networks:
      - pixelvault

  server:
    build:
      context: .
      dockerfile: docker/Dockerfile.server
    env_file: .env
    environment:
      - DB_URL=postgresql://${DB_USER:-pixelvault}:${DB_PASSWORD:-pixelvault}@postgres:5432/${DB_NAME:-pixelvault}
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
      - MINIO_USE_SSL=false
      - CLAMAV_HOST=clamav
      - CLAMAV_PORT=3310
      - NODE_ENV=production
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - pixelvault

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-pixelvault}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-pixelvault}
      POSTGRES_DB: ${DB_NAME:-pixelvault}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-pixelvault}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped
    networks:
      - pixelvault

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-pixelvault}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-changeme}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped
    networks:
      - pixelvault

  clamav:
    image: clamav/clamav:stable
    volumes:
      - clamav_data:/var/lib/clamav
    restart: unless-stopped
    networks:
      - pixelvault

volumes:
  postgres_data:
  minio_data:
  clamav_data:

networks:
  pixelvault:
    driver: bridge
